name: Build Morgan PDF Pro APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'

      - name: Configure Android Project
        run: |
          cp lib/main.dart /tmp/main.dart
          cp pubspec.yaml /tmp/pubspec.yaml
          flutter create --platforms=android --project-name morgan_pdf --org com.morgan.pdf .
          cp /tmp/main.dart lib/main.dart
          cp /tmp/pubspec.yaml pubspec.yaml

      - name: Inject Telegram Open-With & Old Tablet Support (Base64 Safe)
        run: |
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21\n        multiDexEnabled = true/g' android/app/build.gradle
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21\n        multiDexEnabled true/g' android/app/build.gradle
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/g' android/app/build.gradle
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/g' android/app/build.gradle

          echo "" | base64 -d > android/app/src/main/AndroidManifest.xml
          sed -i 's/\\{applicationName}/${applicationName}/g' android/app/src/main/AndroidManifest.xml
          sed -i 's/READ_EXTERNAL_STORAGE'\''/READ_EXTERNAL_STORAGE"/g' android/app/src/main/AndroidManifest.xml
          sed -i 's/caTegory/category/g' android/app/src/main/AndroidManifest.xml

          KT_PATH=$(find android/app/src/main/kotlin -name "MainActivity.kt")
          echo "" | base64 -d > "$KT_PATH"
          sed -i 's/inatialFilePath/initialFilePath/g' "$KT_PATH"
          sed -i 's/(onNewFile"/("onNewFile"/g' "$KT_PATH"

      - name: Install Dependencies & Build APK
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: Morgan-PDF-Pro-Installer
          path: build/app/outputs/flutter-apk/app-release.apk
