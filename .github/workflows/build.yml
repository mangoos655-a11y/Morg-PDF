name: Build Morgan PDF Pro APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Configure Android Project
        run: |
          cp lib/main.dart /tmp/main.dart
          cp pubspec.yaml /tmp/pubspec.yaml
          
          flutter create --platforms=android --project-name morgan_pdf --org com.morgan.pdf .
          
          cp /tmp/main.dart lib/main.dart
          cp /tmp/pubspec.yaml pubspec.yaml

      - name: Inject Telegram Open-With & Old Tablet Support
        run: |
          python3 - << 'EOF'
          import glob, re

          # 1. تحديث build.gradle لدعم التابلت القديم (API 21) وتفعيل MultiDex
          gradle_path = "android/app/build.gradle"
          with open(gradle_path, "r") as f:
              g = f.read()
          g = re.sub(r"minSdkVersion\s+\S+", "minSdkVersion 21\n        multiDexEnabled true", g)
          g = re.sub(r"minSdk\s*=\s*\S+", "minSdk = 21\n        multiDexEnabled = true", g)
          g = re.sub(r"compileSdkVersion\s+\S+", "compileSdkVersion 34", g)
          g = re.sub(r"compileSdk\s*=\s*\S+", "compileSdk = 34", g)
          with open(gradle_path, "w") as f:
              f.write(g)

          # 2. كتابة AndroidManifest.xml بدون أي مسافات زائدة
          manifest_lines = [
              '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
              '    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />',
              '    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />',
              '    <uses-permission android:name="android.permission.WAKE_LOCK" />',
              '    <application',
              '        android:label="Morgan PDF"',
              '        android:name="${applicationName}"',
              '        android:icon="@mipmap/ic_launcher"',
              '        android:requestLegacyExternalStorage="true">',
              '        <activity',
              '            android:name=".MainActivity"',
              '            android:exported="true"',
              '            android:launchMode="singleTask"',
              '            android:theme="@style/LaunchTheme"',
              '            android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"',
              '            android:hardwareAccelerated="true"',
              '            android:windowSoftInputMode="adjustResize">',
              '            <meta-data android:name="io.flutter.embedding.android.NormalTheme" android:resource="@style/NormalTheme" />',
              '            <intent-filter>',
              '                <action android:name="android.intent.action.MAIN"/>',
              '                <category android:name="android.intent.category.LAUNCHER"/>',
              '            </intent-filter>',
              '            <intent-filter>',
              '                <action android:name="android.intent.action.VIEW" />',
              '                <category android:name="android.intent.category.DEFAULT" />',
              '                <category android:name="android.intent.category.BROWSABLE" />',
              '                <data android:scheme="content" />',
              '                <data android:scheme="file" />',
              '                <data android:mimeType="application/pdf" />',
              '            </intent-filter>',
              '            <intent-filter>',
              '                <action android:name="android.intent.action.SEND" />',
              '                <category android:name="android.intent.category.DEFAULT" />',
              '                <data android:mimeType="application/pdf" />',
              '            </intent-filter>',
              '        </activity>',
              '        <meta-data android:name="flutterEmbedding" android:value="2" />',
              '    </application>',
              '</manifest>'
          ]
          with open("android/app/src/main/AndroidManifest.xml", "w") as f:
              f.write("\n".join(manifest_lines))

          # 3. كتابة كود MainActivity.kt لاستقبال ملفات تليجرام وطلب صلاحيات التابلت القديم
          kotlin_lines = [
              'package com.morgan.pdf',
              'import android.Manifest',
              'import android.content.Intent',
              'import android.content.pm.PackageManager',
              'import android.net.Uri',
              'import android.os.Build',
              'import android.os.Bundle',
              'import androidx.core.app.ActivityCompat',
              'import androidx.core.content.ContextCompat',
              'import io.flutter.embedding.android.FlutterActivity',
              'import io.flutter.embedding.engine.FlutterEngine',
              'import io.flutter.plugin.common.MethodChannel',
              'import java.io.File',
              'import java.io.FileOutputStream',
              '',
              'class MainActivity: FlutterActivity() {',
              '    private val CHANNEL = "com.morgan.pdf/intent"',
              '    private var initialFilePath: String? = null',
              '    private var methodChannel: MethodChannel? = null',
              '',
              '    override fun onCreate(savedInstanceState: Bundle?) {',
              '        super.onCreate(savedInstanceState)',
              '        if (Build.VERSION.SDK_INT >= 23 && Build.VERSION.SDK_INT <= 32) {',
              '            if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED) {',
              '                ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.READ_EXTERNAL_STORAGE, Manifest.permission.WRITE_EXTERNAL_STORAGE), 101)',
              '            }',
              '        }',
              '        handleIncomingIntent(intent, true)',
              '    }',
              '',
              '    override fun configureFlutterEngine(flutterEngine: FlutterEngine) {',
              '        super.configureFlutterEngine(flutterEngine)',
              '        methodChannel = MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL)',
              '        methodChannel?.setMethodCallHandler { call, result ->',
              '            if (call.method == "getInitialFile") {',
              '                result.success(initialFilePath)',
              '                initialFilePath = null',
              '            } else {',
              '                result.notImplemented()',
              '            }',
              '        }',
              '    }',
              '',
              '    override fun onNewIntent(intent: Intent) {',
              '        super.onNewIntent(intent)',
              '        handleIncomingIntent(intent, false)',
              '    }',
              '',
              '    private fun handleIncomingIntent(intent: Intent?, isInitial: Boolean) {',
              '        if (intent == null) return',
              '        var uri: Uri? = null',
              '        if (Intent.ACTION_VIEW == intent.action) {',
              '            uri = intent.data',
              '        } else if (Intent.ACTION_SEND == intent.action) {',
              '            uri = intent.getParcelableExtra(Intent.EXTRA_STREAM)',
              '        }',
              '        if (uri != null) {',
              '            val copiedPath = copyUriToInternalTemp(uri)',
              '            if (copiedPath != null) {',
              '                if (isInitial) initialFilePath = copiedPath else methodChannel?.invokeMethod("onNewFile", copiedPath)',
              '            }',
              '        }',
              '    }',
              '',
              '    private fun copyUriToInternalTemp(uri: Uri): String? {',
              '        return try {',
              '            val inputStream = contentResolver.openInputStream(uri) ?: return null',
              '            val tempFile = File(cacheDir, "ext_" + System.currentTimeMillis() + ".pdf")',
              '            val outputStream = FileOutputStream(tempFile)',
              '            inputStream.copyTo(outputStream)',
              '            inputStream.close()',
              '            outputStream.close()',
              '            tempFile.absolutePath',
              '        } catch (e: Exception) {',
              '            uri.path',
              '        }',
              '    }',
              '}'
          ]
          kt_files = glob.glob("android/app/src/main/kotlin/**/MainActivity.kt", recursive=True)
          if kt_files:
              with open(kt_files[0], "w") as f:
                  f.write("\n".join(kotlin_lines))
          EOF

      - name: Install Dependencies & Build APK
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: Morgan-PDF-Pro-Installer
          path: build/app/outputs/flutter-apk/app-release.apk
